# Render's free plan puts the backend to sleep after 15 minutes without
# traffic, and waking it takes 30–60 seconds. Pinging /health every 10 minutes
# keeps it awake. One always-on service fits in the free 750 hours a month.
#
# Override the URL with a repository variable named BACKEND_URL if it changes
# (Settings → Secrets and variables → Actions → Variables).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dailyd-backend.onrender.com' }}
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 \
            "$BACKEND_URL/health"
